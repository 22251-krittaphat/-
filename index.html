<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>งานที่ต้องส่งสัปดาห์นี้</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF9F6;
    --ink:#23252B;
    --navy:#2B3A67;
    --line:#DEDAD0;
    --today:#C0554B;
    --tomorrow:#D9A441;
    --later:#4E7A6B;
    --muted:#7A7D85;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding:48px 20px 80px;
  }

  .page{ max-width:640px; margin:0 auto; }

  header{
    margin-bottom:36px;
    padding-bottom:20px;
    border-bottom:2px solid var(--ink);
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
    flex-wrap:wrap;
  }

  header h1{
    font-family:'Zilla Slab', serif;
    font-size:2.1rem;
    font-weight:700;
    margin:0 0 6px;
    line-height:1.15;
  }

  header p{ margin:0; color:var(--muted); font-size:0.95rem; }

  .refresh{
    background:none;
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 14px;
    font-family:'Inter', sans-serif;
    font-size:0.85rem;
    color:var(--navy);
    cursor:pointer;
  }
  .refresh:hover{ border-color:var(--navy); }

  #task-list{ display:flex; flex-direction:column; gap:14px; }

  .card{
    background:#fff;
    border:1px solid var(--line);
    border-left:6px solid var(--later);
    border-radius:4px;
    padding:16px 18px;
    animation:drop 0.35s ease-out;
  }

  .card.today{ border-left-color:var(--today); }
  .card.tomorrow{ border-left-color:var(--tomorrow); }

  @keyframes drop{
    from{ opacity:0; transform:translateY(-10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .task-title{ font-weight:600; font-size:1.02rem; margin:0 0 6px; }

  .task-meta{
    font-size:0.85rem;
    color:var(--muted);
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
  }

  .badge{
    font-size:0.78rem;
    font-weight:600;
    padding:2px 9px;
    border-radius:999px;
    color:#fff;
    white-space:nowrap;
  }
  .badge.today{ background:var(--today); }
  .badge.tomorrow{ background:var(--tomorrow); }
  .badge.later{ background:var(--later); }

  .state{
    text-align:center;
    color:var(--muted);
    padding:40px 20px;
    font-size:0.95rem;
    line-height:1.6;
  }
  .state code{ background:#EFEBE1; padding:1px 6px; border-radius:3px; font-size:0.85em; }
  .state.error{ color:var(--today); }

  @media (prefers-reduced-motion: reduce){ .card{ animation:none; } }
</style>
</head>
<body>

<div class="page">
  <header>
    <div>
      <h1>งานที่ต้องส่งสัปดาห์นี้</h1>
      <p id="date-range"></p>
    </div>
    <button class="refresh" id="refresh-btn">รีเฟรช</button>
  </header>

  <div id="task-list">
    <div class="state">กำลังโหลดข้อมูล...</div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwFJKSv5jBl9N4Wy2f211H7UURPZzrvA2ZT6CT27FNbEN_iWVsAlMbiJFTFozzGK30n/exec";


  const listEl = document.getElementById('task-list');
  const dateRangeEl = document.getElementById('date-range');
  const refreshBtn = document.getElementById('refresh-btn');

  const thaiWeekday = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];

  function getWeekRange(){
    const now = new Date();
    now.setHours(0,0,0,0);
    const day = now.getDay();
    const monday = new Date(now);
    monday.setDate(now.getDate() - ((day + 6) % 7));
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);
    sunday.setHours(23,59,59,999);
    return { monday, sunday, today: now };
  }

  function setDateRangeLabel(monday, sunday){
    const fmt = d => d.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
    dateRangeEl.textContent = `${fmt(monday)} – ${fmt(sunday)}`;
  }

  function classify(dueDate, today){
    const diffDays = Math.round((dueDate - today) / 86400000);
    if(diffDays === 0) return { cls: 'today', label: 'วันนี้' };
    if(diffDays === 1) return { cls: 'tomorrow', label: 'พรุ่งนี้' };
    return { cls: 'later', label: thaiWeekday[dueDate.getDay()] };
  }

  function renderState(message, isError){
    listEl.innerHTML = `<div class="state${isError ? ' error' : ''}">${message}</div>`;
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function renderTasks(rawTasks){
    const { monday, sunday, today } = getWeekRange();
    setDateRangeLabel(monday, sunday);

    const tasks = rawTasks
      .map(t => ({
        title: (t.title || '').trim(),
        subject: (t.subject || '').trim(),
        dueDate: t.due ? new Date(t.due) : null
      }))
      .filter(t => t.title && t.dueDate instanceof Date && !isNaN(t.dueDate))
      .filter(t => t.dueDate >= monday && t.dueDate <= sunday)
      .sort((a, b) => a.dueDate - b.dueDate);

    if(tasks.length === 0){
      renderState('ไม่มีงานที่ต้องส่งในสัปดาห์นี้');
      return;
    }

    listEl.innerHTML = '';
    tasks.forEach(task => {
      const { cls, label } = classify(task.dueDate, today);
      const card = document.createElement('div');
      card.className = `card ${cls}`;
      card.innerHTML = `
        <p class="task-title">${escapeHtml(task.title)}</p>
        <div class="task-meta">
          ${task.subject ? `<span>${escapeHtml(task.subject)}</span>` : ''}
          <span class="badge ${cls}">${label}</span>
        </div>
      `;
      listEl.appendChild(card);
    });
  }

  function loadData(){
    renderState('กำลังโหลดข้อมูล...');
    fetch(APPS_SCRIPT_URL)
      .then(res => {
        if(!res.ok) throw new Error('network error');
        return res.json();
      })
      .then(data => renderTasks(data))
      .catch(() => renderState('โหลดข้อมูลไม่สำเร็จ ตรวจสอบว่า deploy Apps Script แบบ "Anyone" แล้ว', true));
  }

  refreshBtn.addEventListener('click', loadData);
  loadData();
</script>

</body>
</html>
